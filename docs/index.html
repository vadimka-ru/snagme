<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SnagMe — drag refs into your notch</title>
<meta name="description" content="A tiny macOS app that turns your MacBook notch into a drop zone for design references. Local, free." />
<link rel="icon" href="AppIcon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Atkinson Hyperlegible Mono','SF Mono',ui-monospace,monospace;
    color:#000;background:#fdeef0;
    transition:background-color 4s ease;
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion:reduce){body{transition:none;}}

  .corner{position:absolute;z-index:2;}
  .tl{top:var(--pad);left:var(--pad);}
  .tr{top:var(--pad);right:var(--pad);}
  .bl{bottom:var(--pad);left:var(--pad);}
  .br{bottom:var(--pad);right:var(--pad);}
  :root{--pad:clamp(28px,5vw,80px);}

  .ico{width:64px;height:64px;border-radius:20px;display:block;}
  .name{font-weight:700;font-size:24px;line-height:1.25;color:#000;margin-top:8px;}

  .ver{
    font-weight:500;font-size:14px;line-height:20px;
    background:rgba(0,0,0,0.1);border-radius:8px;padding:4px 8px;color:#000;
  }

  .hero{
    display:flex;flex-direction:column;align-items:center;gap:20px;
    width:min(580px,84vw);z-index:1;
  }
  .shot{width:100%;height:clamp(220px,38vh,324px);background:#000;border-radius:40px;object-fit:cover;display:block;overflow:hidden;}
  .tag{
    font-weight:500;font-size:14px;line-height:20px;color:#000;
    text-align:center;width:100%;text-wrap:pretty;
  }

  .btns{display:flex;gap:12px;}
  .btn{
    text-decoration:none;font-weight:500;font-size:14px;line-height:20px;
    padding:8px 24px;border-radius:12px;cursor:pointer;
    transition:opacity .15s ease, background .15s ease;
  }
  .btn.pri{background:#000;color:#fff;border:1px solid #000;}
  .btn.pri:hover{opacity:.82;}
  .btn.sec{background:transparent;color:#000;border:1px solid #000;}
  .btn.sec:hover{background:rgba(0,0,0,0.05);}

  .meta{
    display:flex;align-items:center;gap:8px;
    font-weight:500;font-size:14px;line-height:20px;color:#000;
  }
  .pill{background:rgba(0,0,0,0.1);border-radius:8px;padding:4px 8px;color:#000;}

  @media (max-width:760px){
    .meta{display:none;}
  }
  @media (max-height:480px){
    body{overflow:auto;}
  }
</style>
</head>
<body>
  <header class="corner tl">
    <img class="ico" src="AppIcon.png" width="92" height="92" alt="SnagMe app icon" />
    <h1 class="name">SnagMe</h1>
  </header>

  <div class="corner tr">
    <span class="ver">v1.0</span>
  </div>

  <main class="hero">
    <video class="shot" autoplay loop muted playsinline aria-label="SnagMe demo">
      <source src="snagme.webm" type="video/webm" />
      <source src="snagme.mp4" type="video/mp4" />
    </video>
    <p class="tag">Drag any design reference straight into&nbsp;your macbook notch. It&nbsp;sorts itself into&nbsp;folders, stays on&nbsp;your mac, and&nbsp;never touches a&nbsp;server.</p>
  </main>

  <div class="corner bl">
    <div class="btns">
      <a class="btn pri" href="#" data-download>Download</a>
      <a class="btn sec" href="https://github.com/vadimka-ru/snagme" target="_blank" rel="noopener" data-github>GitHub</a>
    </div>
  </div>

  <div class="corner br">
    <div class="meta">
      <span>min OS requirement:</span>
      <span class="pill">macOS 14 +</span>
      <span class="pill">Apple Silicon</span>
    </div>
  </div>

  <script>
  (function(){
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    function soft(){
      var h=Math.floor(Math.random()*360);
      var s=45+Math.floor(Math.random()*30);
      var l=93+Math.floor(Math.random()*4);
      return 'hsl('+h+','+s+'%,'+l+'%)';
    }
    function tick(){ document.body.style.backgroundColor=soft(); }
    tick();
    setInterval(tick,5000);
  })();
  </script>
</body>
</html>
